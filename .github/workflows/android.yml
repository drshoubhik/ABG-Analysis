name: Build Android APK

# Builds app/ into an installable debug APK on every relevant push, or on demand
# from the Actions tab ("Run workflow"). The APK is attached to the run as an artifact.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "abg_analysis.py"
      - "tests/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stop before building if the app's logic has drifted from the command-line program
      - name: Check app matches command-line program
        run: python tests/check_app_matches_cli.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      # One cache for everything Buildozer keeps: the Android SDK/NDK/Ant (~/.buildozer),
      # the signing key (~/.android) and the per-app build (app/.buildozer). They must be
      # restored together: app/.buildozer records which SDK packages are installed, so
      # restoring it without the matching SDK makes Buildozer skip needed installs.
      # Saved even when a build fails; a change to buildozer.spec starts fresh.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            app/.buildozer
          key: build-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}-${{ github.run_id }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}-

      # Android only installs an update signed with the same key as the installed app.
      # Use the fixed key from the ANDROID_DEBUG_KEYSTORE repo secret if present;
      # otherwise reuse the cached key, or create one (then cached for later runs).
      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          KS=~/.android/debug.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"; SRC="repo secret"
          elif [ -f "$KS" ]; then
            SRC="cache"
          else
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            SRC="newly generated"
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass android | grep -m1 "SHA256:" | awk '{print $2}')
          echo "::notice title=Signing key::${SRC}, SHA-256 ${FP}"

      # Buildozer fetches Apache Ant from archive.apache.org without retries, which
      # flakes on GitHub runners. Pre-fetch it with retries over IPv4.
      - name: Pre-fetch Apache Ant
        run: |
          ANT=~/.buildozer/android/platform/apache-ant-1.9.4
          if [ ! -d "$ANT" ]; then
            mkdir -p ~/.buildozer/android/platform
            curl -4 -fsSL --retry 6 --retry-all-errors --retry-delay 10 \
              -o /tmp/ant.tgz https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz
            tar -xzf /tmp/ant.tgz -C ~/.buildozer/android/platform
          fi
          ls "$ANT/bin/ant"

      - name: Build APK
        working-directory: app
        run: |
          # "yes" answers the SDK licence prompts; it is killed by SIGPIPE when buildozer
          # exits, so take buildozer's own exit status (pipeline element 2), not pipefail.
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[1]}
          exit $status

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            app/.buildozer
          key: build-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}-${{ github.run_id }}

      # On failure, surface the end of the build log as annotations (readable via the API).
      # GitHub truncates each annotation at ~4 KB, so the text is split into chunks.
      - name: Report build errors
        if: failure()
        working-directory: app
        run: |
          [ -f build.log ] || exit 0
          python3 - <<'PY'
          import re
          log = re.sub(r"\x1b\[[0-9;]*m", "", open("build.log", errors="replace").read())
          lines = [l.rstrip() for l in log.splitlines()]
          noise = re.compile(r"performance hint|noexcept|Declare '|Use an 'int' return|-Werror|-Wno-error|strerror", re.I)
          errs = [l for l in lines if re.search(r"error|exception|failed|not found|no such|traceback", l, re.I)
                  and not noise.search(l)]
          text = "\n".join(["== error-like lines (last 30) =="] + errs[-30:] + ["== last 60 lines =="] + lines[-60:])
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][-9:]
          for n, c in enumerate(chunks, 1):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Buildozer failure {n}/{len(chunks)}::{c}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abg-analyser-apk
          path: app/bin/*.apk
          if-no-files-found: error

      # Publish to a fixed release so the phone can install from one link:
      # https://github.com/drshoubhik/ABG-Analysis/releases/tag/apk-latest
      - name: Publish APK to the apk-latest release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/bin/*.apk | head -1)
          cp "$APK" ABG-Analyser.apk
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Open this page on your phone, tap ABG-Analyser.apk, and allow installing from this source when asked."
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest ABG-Analyser.apk \
            --title "ABG Analyser (latest build)" --notes "$NOTES" --latest
