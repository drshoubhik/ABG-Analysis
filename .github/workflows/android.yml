name: Build Android APK

# Builds app/ into an installable debug APK on every relevant push, or on demand
# from the Actions tab ("Run workflow"). The APK is attached to the run as an artifact.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "abg_analysis.py"
      - "tests/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stop before building if the app's logic has drifted from the command-line program
      - name: Check app matches command-line program
        run: python tests/check_app_matches_cli.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      # Two caches: the Android SDK/NDK/Ant (~/.buildozer) are shared across spec changes;
      # the per-app build (app/.buildozer: p4a checkout, compiled recipes) resets when
      # buildozer.spec changes. Both are saved even when a build fails.
      - name: Restore SDK/NDK cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: sdk-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sdk-${{ runner.os }}-

      - name: Restore app build cache
        uses: actions/cache/restore@v4
        with:
          path: app/.buildozer
          key: appbuild-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}-${{ github.run_id }}
          restore-keys: appbuild-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}-

      # Buildozer fetches Apache Ant from archive.apache.org without retries, which
      # flakes on GitHub runners. Pre-fetch it with retries over IPv4.
      - name: Pre-fetch Apache Ant
        run: |
          ANT=~/.buildozer/android/platform/apache-ant-1.9.4
          if [ ! -d "$ANT" ]; then
            mkdir -p ~/.buildozer/android/platform
            curl -4 -fsSL --retry 6 --retry-all-errors --retry-delay 10 \
              -o /tmp/ant.tgz https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz
            tar -xzf /tmp/ant.tgz -C ~/.buildozer/android/platform
          fi
          ls "$ANT/bin/ant"

      - name: Build APK
        working-directory: app
        run: |
          # "yes" answers the SDK licence prompts; it is killed by SIGPIPE when buildozer
          # exits, so take buildozer's own exit status (pipeline element 2), not pipefail.
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[1]}
          exit $status

      - name: Save SDK/NDK cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: sdk-${{ runner.os }}-${{ github.run_id }}

      - name: Save app build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/.buildozer
          key: appbuild-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}-${{ github.run_id }}

      # On failure, surface the end of the build log as annotations (readable via the API).
      # GitHub truncates each annotation at ~4 KB, so the text is split into chunks.
      - name: Report build errors
        if: failure()
        working-directory: app
        run: |
          [ -f build.log ] || exit 0
          python3 - <<'PY'
          import re
          log = re.sub(r"\x1b\[[0-9;]*m", "", open("build.log", errors="replace").read())
          lines = [l.rstrip() for l in log.splitlines()]
          noise = re.compile(r"performance hint|noexcept|Declare '|Use an 'int' return|-Werror|-Wno-error|strerror", re.I)
          errs = [l for l in lines if re.search(r"error|exception|failed|not found|no such|traceback", l, re.I)
                  and not noise.search(l)]
          text = "\n".join(["== error-like lines (last 30) =="] + errs[-30:] + ["== last 60 lines =="] + lines[-60:])
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][-9:]
          for n, c in enumerate(chunks, 1):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Buildozer failure {n}/{len(chunks)}::{c}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abg-analyser-apk
          path: app/bin/*.apk
          if-no-files-found: error
